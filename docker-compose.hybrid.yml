name: pg-kazsearch-hybrid

services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: hybrid
    container_name: pg-kazsearch-hybrid
    restart: unless-stopped
    volumes:
      - pgdata_hybrid:/var/lib/postgresql
      - ./docker/init-hybrid.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    ports:
      - "55439:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kazsearch
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kazsearch"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch
      - -c
      - maintenance_work_mem=512MB

volumes:
  pgdata_hybrid:
